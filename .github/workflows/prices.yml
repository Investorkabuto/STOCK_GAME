name: Fetch prices

# 平日の日本時間に実行する（GitHub の cron は UTC）。何度実行しても結果は同じなので、回数が多くても安全。
#  - 9:05〜15:45 の20分ごと（:05 / :25 / :45）: 精算待ちの始値（・前日以前の終値）の取得と、場中の株価（観戦用の暫定評価）の取得
#  - 15:50 / 16:35: 終値の取得
#  - 18:05: 最終確定（データの無い銘柄を「値が付かなかった」として確定）
# 毎時0分・30分は GitHub の定期実行が遅れたり飛ばされたりしやすいので避ける。起動が遅れても、締切はAPI側で判定するので公平性に影響しない。
on:
  schedule:
    - cron: "5,25,45 0-6 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "35 7 * * 1-5"
    - cron: "5 9 * * 1-5"
  workflow_dispatch:
    inputs:
      final:
        description: "データの無い銘柄を「値が付かなかった」として確定させる"
        type: boolean
        default: false
      probe:
        description: "接続確認のみ: 指定した銘柄コード（例 7203）の直近の日足を表示し、アプリには書き込まない"
        type: string
        default: ""

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch and ingest
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -n "${{ inputs.probe }}" ]; then
            python scripts/fetch_prices.py --probe "${{ inputs.probe }}"
          elif [ "${{ github.event.schedule }}" = "5 9 * * 1-5" ] || [ "${{ inputs.final }}" = "true" ]; then
            python scripts/fetch_prices.py --final
          else
            python scripts/fetch_prices.py
            # 場中（9:00〜15:45）は、観戦用の場中の株価も取り込む。失敗しても精算用の取得は止めない
            hm=$(TZ=Asia/Tokyo date +%H%M)
            if [ "$hm" -ge 0900 ] && [ "$hm" -le 1545 ]; then
              python scripts/fetch_prices.py --quotes || echo "::warning::live quotes failed"
            fi
          fi
