name: Fetch prices

# 平日の日本時間 9:30 / 10:30（始値）、15:50 / 16:30（終値）、18:00（最終確定）に実行する。
# GitHub の cron は UTC。起動は数分遅れることがあるが、締切はAPI側で判定するので公平性に影響しない。
on:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 1 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      final:
        description: "データの無い銘柄を「値が付かなかった」として確定させる"
        type: boolean
        default: false

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch and ingest
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * 1-5" ] || [ "${{ inputs.final }}" = "true" ]; then
            python scripts/fetch_prices.py --final
          else
            python scripts/fetch_prices.py
          fi
