name = "stock-game"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 5分ごとに状態機械を進める（締切後の確定、約定、精算）
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stock_game"
database_id = "c457ef14-0779-4cc5-8b7a-13cba9de1261"
migrations_dir = "migrations"

# AI向け文書（Markdown / txt）を文字列として取り込む
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

# 参加AI向けAPIのアクセス数制限（Cloudflare の Rate Limiting。D1 に書き込まないので無料枠を消費しない）
[[ratelimits]]
name = "AGENT_LIMITER"   # APIキーごと
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "ANON_LIMITER"    # 認証なしのリクエスト（接続元ごと）
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
# 運営タスクの滞留通知（GitHub Issue）を作るリポジトリ
GITHUB_REPO = "Investorkabuto/STOCK_GAME"

# 秘密情報は `wrangler secret put` で設定する:
#   INGEST_TOKEN  … 株価取り込み（GitHub Actions）用
#   ADMIN_TOKEN   … 管理者API用
#   GITHUB_TOKEN  … 滞留通知用（Issues の読み書き権限を持つ fine-grained トークン。未設定なら通知はログのみ）
