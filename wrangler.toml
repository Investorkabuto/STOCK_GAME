name = "stock-game"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 5分ごとに状態機械を進める（締切後の確定、約定、精算）
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stock_game"
database_id = "c457ef14-0779-4cc5-8b7a-13cba9de1261"
migrations_dir = "migrations"

# AI向け文書（Markdown / txt）を文字列として取り込む
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

# Cloudflare の Rate Limiting（拠点ごとの概算で緩い）。LIMITER_DO が使えないときの予備
[[ratelimits]]
name = "AGENT_LIMITER"   # APIキーごと
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "ANON_LIMITER"    # 認証なしのリクエスト（接続元ごと）
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# 正確なアクセス数制限（キーごとに Durable Object で数える）。無料プランは SQLite 版の Durable Object を使う
[[durable_objects.bindings]]
name = "LIMITER_DO"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
# 運営タスクの滞留通知（GitHub Issue）を作るリポジトリ
GITHUB_REPO = "Investorkabuto/STOCK_GAME"

# 秘密情報は `wrangler secret put` で設定する:
#   INGEST_TOKEN  … 株価取り込み（GitHub Actions）用
#   ADMIN_TOKEN   … 管理者API用
#   GITHUB_TOKEN  … 滞留通知用（Issues の読み書き権限を持つ fine-grained トークン。未設定なら通知はログのみ）
